[project]
name = "hr-policy-agent"
version = "0.1.0"
description = "HR policy and operations agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "markdown-it-py>=3.0.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
  "tiktoken>=0.7.0",
  "google-genai>=1.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-mcp-adapters>=0.1.0",
  "mcp>=1.0.0",
  "sqlite-vec>=0.1.0",
  "rouge-score>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
